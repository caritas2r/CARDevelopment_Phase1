base_model: Qwen/Qwen2.5-3B-Instruct
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

train_on_inputs: false

# Recommended: deterministic prepared dataset location
dataset_prepared_path: prepared/qwen25_3b_template_free_v1
dataset_processes: 1

datasets:
  - path: ./data/train_template_free.jsonl
    type: input_output
    split: train

val_set_size: 0
test_datasets:
  - path: ./data/validation_template_free.jsonl
    type: input_output
    split: train

sequence_len: 1024
sample_packing: false
eval_sample_packing: false

output_dir: outputs/qwen25_3b_preprocess_debug
load_in_4bit: false

micro_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 2e-4
num_epochs: 1
lr_scheduler: cosine
warmup_ratio: 0.0
weight_decay: 0.0
optimizer: adamw_torch

fp16: true
bf16: false
tf32: true
gradient_checkpointing: false

dataset_processes: 1
